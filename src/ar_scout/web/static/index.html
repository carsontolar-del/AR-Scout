<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Scout</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f2f2ef; --surface-3: #e9e9e5;
  --border: #e4e4df; --border-strong: #d4d4cd;
  --text: #16161a; --text-2: #55555c; --muted: #8e8e95;
  --accent: #3b5bdb; --accent-hover: #2f4bc4; --accent-soft: #e8edfd; --accent-text: #2a46b8;
  --good: #1f8a4c; --good-soft: #e3f4ea; --bad: #c9372c; --bad-soft: #fbe9e7; --warn: #a86a00; --warn-soft: #fbf1dc;
  --grid: #efefeb; --shadow: 0 1px 2px rgba(16,16,20,.04), 0 1px 1px rgba(16,16,20,.03);
  --shadow-lg: 0 12px 32px rgba(16,16,20,.10), 0 2px 6px rgba(16,16,20,.06);
  --s1: #3b5bdb; --s2: #1f8a4c; --s3: #b06a00; --s4: #b4387e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f11; --surface: #17171a; --surface-2: #1e1e22; --surface-3: #27272c;
    --border: #2a2a2f; --border-strong: #37373d;
    --text: #f2f2f4; --text-2: #b4b4bb; --muted: #7c7c84;
    --accent: #6b8afd; --accent-hover: #8099ff; --accent-soft: #1d2547; --accent-text: #a9baff;
    --good: #4cc27e; --good-soft: #15301f; --bad: #f07067; --bad-soft: #3a1a17; --warn: #e0a83a; --warn-soft: #33270f;
    --grid: #222226; --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
    --s1: #7d97ff; --s2: #4cc27e; --s3: #e0a83a; --s4: #e57bb9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f11; --surface: #17171a; --surface-2: #1e1e22; --surface-3: #27272c;
  --border: #2a2a2f; --border-strong: #37373d;
  --text: #f2f2f4; --text-2: #b4b4bb; --muted: #7c7c84;
  --accent: #6b8afd; --accent-hover: #8099ff; --accent-soft: #1d2547; --accent-text: #a9baff;
  --good: #4cc27e; --good-soft: #15301f; --bad: #f07067; --bad-soft: #3a1a17; --warn: #e0a83a; --warn-soft: #33270f;
  --grid: #222226; --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
  --s1: #7d97ff; --s2: #4cc27e; --s3: #e0a83a; --s4: #e57bb9;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden, [hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
  padding: 20px 14px; border-right: 1px solid var(--border); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--text); color: var(--bg);
  display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em; }
.brand-name { font-weight: 650; letter-spacing: -.01em; }
.brand-sub { font-size: 11px; color: var(--muted); margin-top: -2px; }
.nav-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 12px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--text-2);
  text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--surface-2); color: var(--text); }
.nav svg { width: 16px; height: 16px; flex: none; opacity: .8; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sources { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--border); }
.sources h5 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.src { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); padding: 2px 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
.dot.off { background: var(--border-strong); }
.theme-toggle { margin-top: 12px; display: flex; gap: 2px; background: var(--surface-2); border-radius: 7px; padding: 2px; }
.theme-toggle button { flex: 1; border: 0; background: none; padding: 4px 0; border-radius: 5px; font-size: 12px; color: var(--text-2); cursor: pointer; }
.theme-toggle button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 32px;
  background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 460px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.search input { width: 100%; padding: 8px 52px 8px 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted);
  border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: var(--surface-2); }
.content { padding: 28px 32px 64px; max-width: 1360px; width: 100%; }

/* ---------- page header */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.page-head p { margin: 4px 0 0; color: var(--text-2); }

/* ---------- controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; box-shadow: var(--shadow); white-space: nowrap;
  transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { box-shadow: none; border-color: transparent; background: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn svg { width: 15px; height: 15px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12px; font-weight: 500; color: var(--text-2); }
.input, select.input { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; outline: none; min-width: 0; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.toolbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
.segmented { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.segmented button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--text-2); font-weight: 500; font-size: 13px; }
.segmented button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.segmented .c { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

/* ---------- cards & tables */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }
.card h3 { margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
.card h3 .aside { font-weight: 400; color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border);
  white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sorted { color: var(--text); }
td { padding: 11px 14px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.row { cursor: pointer; transition: background .1s; }
tr.row:hover td { background: var(--surface-2); }
.who { display: flex; align-items: center; gap: 12px; min-width: 220px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--surface-3); flex: none;
  display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--text-2); }
.who .n { font-weight: 600; }
.who .g { font-size: 12px; color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.rank { color: var(--muted); font-variant-numeric: tabular-nums; width: 36px; }
.dim { color: var(--muted); }
.score { display: inline-flex; align-items: center; gap: 10px; }
.score b { font-weight: 650; font-variant-numeric: tabular-nums; min-width: 22px; text-align: right; }
.meter { width: 56px; height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.score.low b { color: var(--text-2); }
.score.low .meter i { background: var(--muted); }
.up { color: var(--good); font-weight: 500; } .down { color: var(--bad); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2);
  color: var(--text-2); font-size: 12px; font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.pill.diy { background: var(--accent-soft); color: var(--accent-text); }
.pill.st-watching { background: var(--surface-2); color: var(--text); }
.pill.st-contacted { background: var(--warn-soft); color: var(--warn); }
.pill.st-meeting { background: var(--accent-soft); color: var(--accent-text); }
.pill.st-signed { background: var(--good-soft); color: var(--good); }
.pill.st-passed { background: var(--surface-2); color: var(--muted); }
.empty { padding: 56px 24px; text-align: center; color: var(--text-2); }
.empty h4 { margin: 0 0 4px; color: var(--text); font-size: 15px; font-weight: 600; }
.foot { padding: 10px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.pill.tag { background: none; border: 1px solid var(--border); color: var(--text-2); padding: 1px 8px; font-size: 11.5px; }
.mini { display: inline-flex; padding: 0 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
  background: var(--surface-2); color: var(--text-2); margin-left: 6px; vertical-align: 1px; }
.mini.pos { background: var(--good-soft); color: var(--good); }
.mini.warn { background: var(--warn-soft); color: var(--warn); }
.mini.ok { background: var(--good-soft); color: var(--good); }
.mini.hot { background: var(--good); color: var(--surface); }
.mini.lc-self { background: var(--good-soft); color: var(--good); }
.mini.lc-indie { background: var(--surface-2); color: var(--text-2); }
.mini.lc-major { background: var(--accent-soft); color: var(--accent-text); }
.field.check .check-row { display: flex; align-items: center; gap: 6px; height: 34px; font-size: 13px; color: var(--text-2); }
.cmp-box { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }
.cmpbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px 10px 16px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); max-width: calc(100vw - 32px); font-size: 13px; }
.cmpbar .who-list { color: var(--text-2); max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-table td, .cmp-table th { white-space: normal; vertical-align: top; }
.cmp-table th.metric { color: var(--text-2); font-weight: 500; width: 190px; }
.cmp-table .best { color: var(--good); font-weight: 600; }
.cmp-head { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.cmp-head .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.cmp-chart svg { width: 100%; height: 260px; display: block; overflow: visible; }
.cmp-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-top: 8px; }
.cmp-legend span { display: inline-flex; align-items: center; gap: 6px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
.lane { background: var(--surface-2); border-radius: 12px; padding: 10px; display: grid; gap: 8px; min-height: 120px; align-content: start; }
.lane.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.lane h4 { margin: 2px 4px 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); display: flex; justify-content: space-between; }
.lane .empty-lane { font-size: 12px; color: var(--muted); padding: 8px 4px; }
.pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: grid; gap: 6px; cursor: grab; box-shadow: var(--shadow); }
.pcard:active { cursor: grabbing; }
.pcard .top { display: flex; gap: 8px; align-items: center; min-width: 0; }
.pcard .top .avatar { width: 28px; height: 28px; font-size: 11px; }
.pcard .nm { font-weight: 600; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .nm:hover { text-decoration: underline; }
.pcard .meta-line { font-size: 12px; color: var(--text-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pcard .next { font-size: 12.5px; }
.pcard .due.late { color: var(--bad); font-weight: 600; }
.pcard select { font-size: 12px; padding: 3px 6px; }
.pipeline-edit { display: grid; grid-template-columns: 1fr 1.6fr auto auto; gap: 8px; align-items: end; margin-top: 12px; flex-basis: 100%; }
.pipeline-edit .field span { font-size: 11.5px; }
@media (max-width: 760px) { .board { grid-template-columns: repeat(5, 80vw); } .pipeline-edit { grid-template-columns: 1fr 1fr; } }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.confirm-row { display: grid; gap: 8px; margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-size: 12.5px; }
.explain { display: grid; gap: 4px; margin: 4px 0 6px; }
.why-h { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.why-h.pos { color: var(--good); } .why-h.neg { color: var(--warn); }
.why { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; color: var(--text); }
.help { max-width: 760px; line-height: 1.6; }
.help h1 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 8px; }
.help-h { font-size: 16px; margin: 28px 0 8px; letter-spacing: -.01em; }
.help p, .help li { color: var(--text-2); }
.help ol, .help ul { padding-left: 20px; display: grid; gap: 6px; }
.help-dl { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 8px 16px; margin: 0; }
.help-dl dt { font-weight: 500; }
.help-dl dd { margin: 0; color: var(--text-2); }
@media (max-width: 640px) { .help-dl { grid-template-columns: 1fr; } .help-dl dd { margin-bottom: 8px; } }
body:not(.admin) .admin-only { display: none !important; }
.admin-toggle { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.admin-toggle input { accent-color: var(--accent); }
.signout { display: block; margin-top: 8px; font-size: 12px; }
/* form fields in grids must be allowed to shrink, or they push the page wider than a phone */
.disc-form > *, .pipeline-edit > *, .toolbar > .field { min-width: 0; }
.disc-form .input, .pipeline-edit .input { width: 100%; }
.pipeline-edit { width: 100%; }
@media (max-width: 520px) { .disc-form, .pipeline-edit { grid-template-columns: 1fr; } }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.label-cell { display: inline-flex; align-items: center; max-width: 260px; }
.nav .count.warn-count { color: var(--warn); font-weight: 600; }
.review-list { display: grid; gap: 10px; }
.review-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 16px; }
.review-item .n { font-weight: 600; cursor: pointer; }
.review-item .n:hover { text-decoration: underline; }
.review-item ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); font-size: 13px; display: grid; gap: 3px; }
.review-item .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.review-banner { display: grid; gap: 8px; padding: 12px 16px; margin-bottom: 20px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.review-banner.ok { background: var(--good-soft); color: var(--good); }
.review-banner ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.review-banner .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
@media (max-width: 760px) { .review-item { grid-template-columns: auto minmax(0, 1fr); } .review-item .acts { grid-column: 1 / -1; justify-content: flex-start; } }
.who .t { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.yt-note { font-size: 11.5px; font-style: italic; }
.star { border: 0; background: none; cursor: pointer; color: var(--border-strong); padding: 4px; border-radius: 6px; line-height: 0; }
.star:hover { color: var(--text-2); background: var(--surface-3); }
.star.on { color: var(--warn); }
.star svg { width: 16px; height: 16px; }
.star:disabled { opacity: .5; cursor: progress; }
.banner { display: flex; align-items: center; gap: 14px; padding: 12px 16px; margin-bottom: 16px; border-radius: 10px;
  background: var(--warn-soft); color: var(--warn); font-size: 13px; flex-wrap: wrap; }
.banner b { font-weight: 600; }
.banner .btn { margin-left: auto; }
.health { display: grid; gap: 3px; margin: 14px 0 0; font-size: 12px; color: var(--text-2); }
.health .row { display: flex; justify-content: space-between; gap: 8px; }
.health .row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
.health .warn { color: var(--warn) !important; }
.tag-edit { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.tag-edit .input { flex: 1; min-width: 200px; }

/* ---------- stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { padding: 16px 18px; }
.stat .l { font-size: 12px; color: var(--text-2); font-weight: 500; }
.stat .v { font-size: 26px; font-weight: 650; letter-spacing: -.025em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- artist page */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); text-decoration: none; font-size: 13px; margin-bottom: 18px; }
.back:hover { color: var(--text); }
.hero { display: flex; gap: 22px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
.hero img, .hero .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; font-size: 28px; box-shadow: var(--shadow-lg); }
.hero-main { flex: 1; min-width: 260px; }
.hero h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
.meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--text-2); margin-top: 6px; font-size: 13px; }
.meta span + span::before { content: "·"; margin-right: 14px; color: var(--muted); }
.links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.links a { font-size: 12px; font-weight: 500; text-decoration: none; padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); background: var(--surface); }
.links a:hover { color: var(--text); border-color: var(--border-strong); }
.hero-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .l { font-size: 12px; color: var(--text-2); font-weight: 500; }
.kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; color: var(--muted); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent-text); cursor: pointer; font-size: inherit; }
.linkish:hover { text-decoration: underline; }
.yt-src { margin-top: 4px; }
.yt-src a { color: var(--text-2); text-decoration: none; } .yt-src a:hover { color: var(--text); }
.kpi .d.up { color: var(--good); } .kpi .d.down { color: var(--bad); }

.score-card { display: flex; gap: 18px; align-items: center; margin-bottom: 16px; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; font-weight: 700; letter-spacing: -.03em; }
.comp { display: grid; grid-template-columns: 96px 1fr 34px; gap: 10px; align-items: center; margin: 9px 0; font-size: 13px; }
.comp .k { color: var(--text-2); }
.comp .k small { color: var(--muted); }
.comp .bar { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.comp .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.comp .bar.na { background: repeating-linear-gradient(45deg, var(--surface-3) 0 4px, transparent 4px 8px); }
.comp .x { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.flags { display: grid; gap: 6px; margin-top: 14px; }
.flag { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; background: var(--surface-2); color: var(--text-2); }
.flag.pos { background: var(--good-soft); color: var(--good); }
.flag.warn { background: var(--warn-soft); color: var(--warn); }
.flag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-top: 6px; flex: none; }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.chart { padding: 14px 16px 10px; }
.chart .h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.chart .h b { font-size: 12px; font-weight: 500; color: var(--text-2); }
.chart .h span { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: 110px; display: block; overflow: visible; }
.chart .na { height: 110px; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 0 12px;
  background: var(--surface-2); border-radius: 8px; }

.rel { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); font-size: 13px; align-items: center; }
.rel:last-child { border-bottom: 0; }
.rel .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel .ty { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.rel .dt { color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12.5px; }
.chip:hover { border-color: var(--border-strong); background: var(--surface-2); }
.chip small { color: var(--muted); margin-left: 4px; }
.note { padding: 10px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.note:last-of-type { border-bottom: 0; }
.note time { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
textarea.input { width: 100%; min-height: 72px; resize: vertical; margin-top: 10px; }
.errors { margin-top: 16px; font-size: 12px; color: var(--muted); }

/* ---------- discover */
.disc-form { display: grid; grid-template-columns: 220px 1fr 110px 110px 80px auto; gap: 12px; align-items: end; padding: 16px; margin-bottom: 16px; }
.progress { height: 2px; background: var(--surface-3); overflow: hidden; border-radius: 2px; margin: -16px 0 14px; }
.progress i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(400%); } }

/* ---------- misc */
.skeleton { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%;
  animation: shimmer 1.4s infinite; border-radius: 6px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.tooltip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow-lg); display: none; z-index: 50; }
.tooltip strong { font-size: 14px; display: block; font-variant-numeric: tabular-nums; }
.tooltip .tip-rel { display: block; margin-top: 4px; color: var(--warn); font-weight: 500; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg);
  padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: .2s; z-index: 60; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .disc-form { grid-template-columns: 1fr 1fr; }
  .disc-form .q { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 40; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 10px 16px; }
  .content { padding: 20px 16px 48px; }
  .kbd { display: none; }
  .hero img, .hero .avatar { width: 72px; height: 72px; }
  .hero h1 { font-size: 24px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">AR</div>
      <div><div class="brand-name">AR Scout</div><div class="brand-sub">A&amp;R research</div></div>
    </div>
    <nav class="nav">
      <a href="#/" data-nav="leaderboard">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 13.5h12M4 11V7M8 11V3M12 11V5.5"/></svg>
        Leaderboard <span class="count" id="cntAll"></span></a>
      <a href="#/movers" data-nav="movers">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 12 6 7.5l3 3 5.5-6"/><path d="M10.5 4.5h4v4"/></svg>
        Movers this week</a>
      <a href="#/watchlist" data-nav="watchlist">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></svg>
        Watchlist <span class="count" id="cntWatch"></span></a>
      <a href="#/discover" data-nav="discover">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="m10.5 5.5-1.6 3.4-3.4 1.6 1.6-3.4z"/></svg>
        Discover</a>
      <a href="#/review" data-nav="review">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5 14.5 13h-13z"/><path d="M8 6v3.2M8 11.2v.3"/></svg>
        Needs review <span class="count warn-count" id="cntReview"></span></a>
      <a href="#/help" data-nav="help">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.4M8 11.3v.2"/></svg>
        Help</a>
    </nav>
    <div class="sources">
      <h5>Data sources</h5>
      <div id="srcList"></div>
      <div class="health" id="health"></div>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button data-theme-set="light">Light</button><button data-theme-set="auto">Auto</button><button data-theme-set="dark">Dark</button>
      </div>
      <label class="admin-toggle" title="Shows refresh, linking, account changes, delete and system status. Hides them again when off.">
        <input type="checkbox" id="adminToggle"> Admin tools</label>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn ghost menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
      <form class="search" id="searchForm">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
        <input id="searchInput" placeholder="Look up any artist…" aria-label="Look up artist" autocomplete="off">
        <span class="kbd">⌘K</span>
      </form>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="tooltip" id="tip"></div>
<div class="toast" id="toast"></div>
<div class="cmpbar" id="cmpbar" hidden></div>

<script>
// ============================================================ helpers
const $ = (s, root = document) => root.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
};
const svgEl = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const fmt = v => v == null ? "–" : Math.abs(v) >= 1e9 ? (v / 1e9).toFixed(1) + "B" : Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + "M"
  : Math.abs(v) >= 1e4 ? Math.round(v / 1e3) + "k" : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(1) + "k" : Math.round(v).toString();
const pct = v => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const ago = iso => {
  if (!iso) return "–";
  const days = Math.round((Date.now() - new Date(iso)) / 864e5);
  if (days < 0) return "upcoming";
  if (days < 1) return "today";
  if (days < 14) return days + "d ago";
  if (days < 60) return Math.round(days / 7) + "w ago";
  if (days < 730) return Math.round(days / 30) + "mo ago";
  return Math.round(days / 365) + "y ago";
};
const initials = n => n.replace(/^the\s+/i, "").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const avatar = (url, name, cls = "avatar") => url ? el("img", { class: cls, src: url, alt: "", loading: "lazy" }) : el("div", { class: cls }, initials(name));
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("Sign in first"); }  // session expired
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); };
const STATUSES = ["watching", "contacted", "meeting", "signed", "passed"];  // pipeline order
const METRICS = {
  "youtube.views": "YouTube views", "youtube.subscribers": "YouTube subscribers",
  "lastfm.listeners": "Last.fm listeners", "lastfm.playcount": "Last.fm plays",
  "instagram.followers": "Instagram followers",
  "spotify.monthly_listeners": "Spotify monthly listeners", "tiktok.followers": "TikTok followers",
  "deezer.fans": "Deezer fans", "wikipedia.pageviews_30d": "Wikipedia views (30d)", "spotify.followers": "Spotify followers",
};
// Short labels for score flags shown inline in tables; anything unlisted only appears on the artist page.
const FLAG_SHORT = [
  [/^accelerating/, "Accelerating", "hot"],
  [/^deep fandom/, "Deep fandom", "pos"], [/DIY distributor/, "Likely unsigned", "pos"],
  [/^YouTube count looks off/, "Check YT", "warn"], [/^score capped/, "Capped", ""], [/^already established/, "Established", ""],
];
const PLATFORMS = [["any", "any platform"], ["youtube", "YouTube subs"], ["instagram", "Instagram followers"], ["lastfm", "Last.fm listeners"], ["deezer", "Deezer fans"]];
const STAR = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.3l2 4.3 4.6.5-3.4 3.2.9 4.6L8 11.6l-4.1 2.3.9-4.6L1.4 6.1 6 5.6z"/></svg>';
const COMP = { momentum: ["Momentum", 40], engagement: ["Engagement", 20], headroom: ["Headroom", 20], activity: ["Activity", 10], signability: ["Signability", 10] };

// ============================================================ theme
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("[data-theme-set]").forEach(b => b.classList.toggle("on", b.dataset.themeSet === t));
  try { localStorage.setItem("ars-theme", t); } catch {}
}
let savedTheme = "auto"; try { savedTheme = localStorage.getItem("ars-theme") || "auto"; } catch {}
applyTheme(savedTheme);
document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => applyTheme(b.dataset.themeSet));

// ============================================================ routing
const view = $("#view");
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || "/");
  $("#sidebar").classList.remove("open");
  const [, page, arg] = h.split("/");
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active",
    a.dataset.nav === (page || "leaderboard") || (page === "artist" && a.dataset.nav === lastList)));
  window.scrollTo(0, 0);
  if (page === "artist" && arg) return renderArtist(arg);
  if (page === "watchlist") { lastList = "watchlist"; return renderWatchlist(); }
  if (page === "discover") { lastList = "discover"; return renderDiscover(); }
  if (page === "review") { lastList = "review"; return renderReview(); }
  if (page === "movers") { lastList = "movers"; return renderMovers(); }
  if (page === "compare") return renderCompare();
  if (page === "help") { lastList = "help"; return renderHelp(); }
  lastList = "leaderboard"; return renderLeaderboard();
}
let lastList = "leaderboard";
window.addEventListener("hashchange", route);
const go = name => location.hash = "/artist/" + encodeURIComponent(name);

$("#searchForm").onsubmit = e => { e.preventDefault(); const n = $("#searchInput").value.trim(); if (n) { go(n); $("#searchInput").blur(); } };
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); $("#searchInput").focus(); $("#searchInput").select(); } });
$("#menuBtn").onclick = () => $("#sidebar").classList.toggle("open");

// ============================================================ shared table
const COLS = [
  { key: "score", label: "Breakout", r: false, get: r => r.score },
  { key: "deezer_fans", label: "Deezer fans", r: true, get: r => r.deezer_fans },
  { key: "lastfm_listeners", label: "Last.fm listeners", r: true, get: r => r.lastfm_listeners },
  { key: "depth", label: "Plays / listener", r: true, get: r => r.lastfm_listeners ? r.lastfm_playcount / r.lastfm_listeners : null },
  { key: "youtube_subscribers", label: "YT subs", r: true, get: r => r.youtube_subscribers },
  { key: "youtube_views", label: "YT views", r: true, get: r => r.youtube_views },
  { key: "instagram_followers", label: "IG followers", r: true, get: r => r.instagram_followers },
  { key: "growth", label: "Growth / mo", r: true, get: r => { const v = Object.values(r.monthly_growth || {}); return v.length ? Math.max(...v) : null; } },
  { key: "snapshot_days", label: "Days tracked", r: true, get: r => r.snapshot_days },
  { key: "latest_release", label: "Last release", r: false, get: r => r.latest_release },
];

function scoreCell(r) {
  const low = r.confidence < 0.7;
  return el("span", { class: "score" + (low ? " low" : ""), title: `Confidence ${Math.round(r.confidence * 100)}% — share of the model that had data` },
    el("b", {}, Math.round(r.score)), el("span", { class: "meter" }, el("i", { style: `width:${r.score}%` })));
}

function dataTable(rows, { empty, showStatus = true, sort = { key: "score", dir: -1 }, onSort } = {}) {
  if (!rows.length) return el("div", { class: "card" }, el("div", { class: "empty" }, el("h4", {}, empty[0]), empty[1]));
  const col = COLS.find(c => c.key === sort.key) || COLS[0];
  rows = [...rows].sort((a, b) => {
    const x = col.get(a), y = col.get(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * sort.dir;
  });
  const head = el("tr", {}, el("th", { title: "Compare" }, ""), el("th", {}, "#"), el("th", {}, "Artist"),
    ...COLS.map(c => el("th", { class: "sortable" + (c.r ? " r" : "") + (c.key === sort.key ? " sorted" : ""),
      onclick: () => onSort && onSort({ key: c.key, dir: c.key === sort.key ? -sort.dir : -1 }) },
      c.label + (c.key === sort.key ? (sort.dir < 0 ? " ↓" : " ↑") : ""))),
    el("th", {}, "Label"), showStatus ? el("th", {}, "Status") : null, el("th", {}, ""));
  const body = el("tbody", {}, rows.map((r, i) => {
    const depth = COLS[3].get(r), growth = COLS.find(c => c.key === "growth").get(r), label = r.label || "";
    const minis = FLAG_SHORT.filter(([re]) => r.flags.some(f => re.test(f)))
      .map(([re, t, c]) => el("span", { class: "mini " + c, title: r.flags.find(f => re.test(f)) }, t));
    const ms = r.management?.status;
    if (ms === "managed" || ms === "listed") minis.push(el("span", { class: "mini", title: r.management.evidence || r.management.label }, "Managed"));
    else if (ms === "unmanaged" || ms === "not_listed") minis.push(el("span", { class: "mini pos", title: r.management.label + (r.management.source ? ` (${r.management.source})` : "") }, "No mgmt"));
    if (r.verified) minis.unshift(el("span", { class: "mini ok", title: "Linked accounts checked by a person" }, "✓ Verified"));
    else if (r.review?.length) minis.unshift(el("span", { class: "mini warn", title: r.review.join("\n") }, "Review"));
    return el("tr", { class: "row", onclick: () => go(r.name) },
      el("td", {}, cmpBox(r)),
      el("td", { class: "rank" }, i + 1),
      el("td", {}, el("div", { class: "who" }, avatar(r.image_url, r.name),
        el("div", {}, el("div", { class: "n" }, r.name, minis), el("div", { class: "g" }, [r.country, ...(r.genres || [])].filter(Boolean).join(" · ") || "—"),
          r.tags?.length ? el("div", { class: "t" }, r.tags.map(t => el("span", { class: "pill tag" }, t))) : null))),
      el("td", {}, scoreCell(r)),
      el("td", { class: "r num" }, fmt(r.deezer_fans)),
      el("td", { class: "r num" }, fmt(r.lastfm_listeners)),
      el("td", { class: "r num" + (depth > 30 ? " up" : "") }, depth == null ? "–" : depth.toFixed(1)),
      ytCell(r),
      el("td", { class: "r num" + (r.youtube_views == null ? " dim" : "") }, fmt(r.youtube_views)),
      el("td", { class: "r num" + (r.instagram_followers == null ? " dim" : ""),
        title: r.instagram_followers == null ? "No count: Instagram not set up, no account linked, or a personal/private account" : "" }, fmt(r.instagram_followers)),
      el("td", { class: "r num " + (growth == null ? "dim" : growth > 0.005 ? "up" : growth < -0.005 ? "down" : ""),
        title: growth == null ? "A growth rate needs a week of snapshots" : "" }, growth == null ? "–" : pct(growth)),
      el("td", { class: "r num" + (r.snapshot_days < 7 ? " dim" : ""), title: r.last_snapshot ? "Last snapshot " + new Date(r.last_snapshot).toLocaleString() : "" }, r.snapshot_days || "–"),
      el("td", { class: "dim", title: r.latest_release || "" }, ago(r.latest_release)),
      el("td", {}, label ? labelPill(label, r.label_class) : el("span", { class: "dim" }, "–")),
      showStatus ? el("td", {}, r.status ? el("span", { class: "pill st-" + r.status }, r.status) : "") : null,
      el("td", {}, starBtn(r)));
  }));
  return el("div", { class: "card" }, el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, head), body)),
    el("div", { class: "foot" }, el("span", {}, `${rows.length} artist${rows.length === 1 ? "" : "s"}`),
      el("span", {}, "Scores in grey have under 70% confidence · Plays / listener over 30 = deep fandom · Growth rates need a week of snapshots")));
}

// YouTube: tell "never looked up" apart from "looked up, no channel" and "channel numbers don't add up".
// Label type decides signability: self-released and DIY look unsigned, a major is already taken.
const LABEL_CLASS = { self: ["Self-released", "lc-self"], diy: ["DIY", "lc-self"], indie: ["Indie", "lc-indie"], major: ["Major", "lc-major"] };

// Each viewer's filters are remembered in their own browser. Storage can be missing (private windows), so every
// read and write is guarded and the defaults always work.
function remembered(name, defaults, skip = []) {
  const key = "ars-filters-" + name;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch {}
  const state = { ...defaults };
  for (const k of Object.keys(defaults)) if (k in saved && !skip.includes(k)) state[k] = saved[k];
  const save = () => { try { localStorage.setItem(key, JSON.stringify(Object.fromEntries(Object.entries(state).filter(([k]) => !skip.includes(k))))); } catch {} };
  return new Proxy(state, {
    set(t, k, v) { t[k] = v; save(); return true; },
  });
}
const resetTo = (state, defaults) => Object.assign(state, structuredClone(defaults));

function drawCompareChart(box, reps) {
  const series = reps.map((rp, i) => {
    const pts = rp.history.filter(h => h.metric === cmpMetric);
    if (pts.length < 2) return null;
    const base = pts[0].value;
    return { name: rp.artist.name, color: CMP_COLORS[i], pts: pts.map(h => ({ t: new Date(h.taken_at).getTime(), v: base ? (h.value - base) / base : 0, raw: h.value })) };
  }).filter(Boolean);
  if (!series.length) { box.replaceChildren(el("div", { class: "dim", style: "padding:24px 0;text-align:center" }, "No artist here has two days of this number yet.")); return; }
  const all = series.flatMap(s => s.pts);
  const W = 640, H = 260, P = { l: 52, r: 12, t: 12, b: 26 };
  const x0 = Math.min(...all.map(p => p.t)), x1 = Math.max(...all.map(p => p.t));
  let y0 = Math.min(0, ...all.map(p => p.v)), y1 = Math.max(0.001, ...all.map(p => p.v));
  const pad = (y1 - y0) * 0.1; y1 += pad; if (y0 < 0) y0 -= pad;
  const sx = t => P.l + (t - x0) / (x1 - x0 || 1) * (W - P.l - P.r), sy = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Growth comparison");
  const add = (tag, attrs, text) => { const n = document.createElementNS(ns, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; svg.append(n); return n; };
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = sy(v);
    add("line", { x1: P.l, x2: W - P.r, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 });
    add("text", { x: P.l - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%");
  }
  const fmtD = t => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  add("text", { x: P.l, y: H - 6, "font-size": 11, fill: "var(--muted)" }, fmtD(x0));
  add("text", { x: W - P.r, y: H - 6, "font-size": 11, fill: "var(--muted)", "text-anchor": "end" }, fmtD(x1));
  for (const s of series) {
    add("path", { d: s.pts.map((p, i) => (i ? "L" : "M") + sx(p.t) + " " + sy(p.v)).join(""), fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
    const last = s.pts.at(-1);
    add("circle", { cx: sx(last.t), cy: sy(last.v), r: 3.5, fill: s.color });
  }
  box.replaceChildren(svg, el("div", { class: "cmp-legend" }, series.map(s => el("span", {},
    el("i", { style: `display:inline-block;width:10px;height:10px;border-radius:3px;background:${s.color}` }),
    `${s.name}: ${pct(s.pts.at(-1).v)} (${fmt(s.pts.at(-1).raw)})`))));
}

// releases: [{title, date, type}] from the artist's release list; each one in range gets a dashed marker.
function lineChart(points, label, releases = []) {
  const last = points.at(-1)?.value;
  const wrap = el("div", { class: "card chart" }, el("div", { class: "h" }, el("b", {}, label), el("span", {}, fmt(last))));
  const days = new Set(points.map(p => p.taken_at.slice(0, 10))).size;
  if (days < 2) {
    wrap.append(el("div", { class: "na" }, "Trend line appears after snapshots on two different days."));
    return wrap;
  }
  const W = 300, H = 110, P = { l: 4, r: 4, t: 8, b: 18 };
  const xs = points.map(p => new Date(p.taken_at).getTime()), ys = points.map(p => p.value);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 *= 0.98; y1 = y1 * 1.02 || 1; }
  const pad = (y1 - y0) * 0.15; y0 -= pad; y1 += pad;
  const sx = x => P.l + (x - x0) / (x1 - x0 || 1) * (W - P.l - P.r);
  const sy = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", `${label}: ${fmt(ys[0])} to ${fmt(ys.at(-1))}`);
  const add = (tag, attrs) => { const n = document.createElementNS(ns, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); svg.append(n); return n; };
  const line = points.map((p, i) => (i ? "L" : "M") + sx(xs[i]) + " " + sy(p.value)).join("");
  const id = "g" + Math.random().toString(36).slice(2);
  const defs = add("defs", {});
  defs.innerHTML = `<linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>`;
  add("path", { d: `${line}L${sx(x1)} ${H - P.b}L${sx(x0)} ${H - P.b}Z`, fill: `url(#${id})` });
  add("path", { d: line, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" });
  const fmtD = t => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  add("text", { x: P.l, y: H - 3, "font-size": 10, fill: "var(--muted)" }).textContent = fmtD(x0);
  add("text", { x: W - P.r, y: H - 3, "font-size": 10, fill: "var(--muted)", "text-anchor": "end" }).textContent = fmtD(x1);
  const DAY = 864e5;
  const marks = releases.map(r => ({ ...r, t: new Date(r.date + "T12:00:00Z").getTime() }))
    .filter(r => r.t >= x0 - DAY / 2 && r.t <= x1 + DAY / 2);
  for (const r of marks) {
    const rx = Math.max(P.l, Math.min(W - P.r, sx(r.t)));
    add("line", { x1: rx, x2: rx, y1: P.t, y2: H - P.b, stroke: "var(--warn)", "stroke-width": 1, "stroke-dasharray": "3 3",
      "vector-effect": "non-scaling-stroke", opacity: .8 });
  }
  const hair = add("line", { y1: P.t, y2: H - P.b, stroke: "var(--border-strong)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", visibility: "hidden" });
  const dot = add("circle", { r: 3.5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  const hit = add("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" });
  const tip = $("#tip");
  hit.addEventListener("pointermove", ev => {
    const rect = svg.getBoundingClientRect(), mx = (ev.clientX - rect.left) / rect.width * W;
    let b = 0; xs.forEach((x, i) => { if (Math.abs(sx(x) - mx) < Math.abs(sx(xs[b]) - mx)) b = i; });
    const cx = sx(xs[b]), cy = sy(ys[b]);
    hair.setAttribute("visibility", "visible"); dot.setAttribute("visibility", "visible");
    hair.setAttribute("x1", cx); hair.setAttribute("x2", cx); dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
    const near = marks.filter(r => Math.abs(r.t - xs[b]) <= 1.5 * DAY);
    tip.replaceChildren(el("strong", {}, Math.round(ys[b]).toLocaleString()), el("span", { class: "dim" }, new Date(xs[b]).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })),
      ...near.map(r => el("span", { class: "tip-rel" }, `Release: ${r.title} (${r.type}, ${fmtD(r.t)})`)));
    tip.style.display = "block"; tip.style.left = Math.min(ev.clientX + 12, innerWidth - 180) + "px"; tip.style.top = ev.clientY - 48 + "px";
  });
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });
  wrap.append(svg);
  return wrap;
}

function ring(score, conf) {
  const C = 2 * Math.PI * 36, low = conf < 0.7;
  const r = el("div", { class: "ring", title: `Confidence ${Math.round(conf * 100)}%` });
  r.innerHTML = `<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--surface-3)" stroke-width="7"/>
    <circle cx="42" cy="42" r="36" fill="none" stroke="${low ? "var(--muted)" : "var(--accent)"}" stroke-width="7" stroke-linecap="round"
    stroke-dasharray="${C * score / 100} ${C}"/></svg>`;
  r.append(el("div", { class: "val" }, Math.round(score)));
  return r;
}

// "12.5k", "1.2M", "12,500" or "1.2 million" -> a number; null if it isn't one.
function parseCount(text) {
  const t = String(text || "").trim().toLowerCase().replace(/,/g, "").replace(/\s+/g, "");
  const m = t.match(/^(\d+(?:\.\d+)?)(k|thousand|m|million|b|billion)?$/);
  if (!m) return null;
  const mult = { k: 1e3, thousand: 1e3, m: 1e6, million: 1e6, b: 1e9, billion: 1e9 }[m[2]] || 1;
  return Math.round(parseFloat(m[1]) * mult);
}

// Plain-language reasons behind the score, built from the same numbers. Each line is for or against the artist.
function explainScore(r) {
  const s = r.score, c = s.components, m = s.metrics, a = r.artist, rel = r.releases || {};
  const pro = [], con = [];
  const acc = s.acceleration;
  if (acc?.accelerating) {
    const best = acc.faster.map(k => acc.platforms[k]).sort((x, y) => (y.ratio || 0) - (x.ratio || 0))[0];
    pro.push(`Growth sped up recently: daily gains ${best.ratio ? best.ratio.toFixed(1) + "× faster" : "started"} on ${best.platform}${acc.faster.length > 1 ? ` and ${acc.faster.length - 1} other platform${acc.faster.length > 2 ? "s" : ""}` : ""}.`);
  }
  if (c.momentum == null) con.push("Not enough history yet to measure growth (needs a week of daily snapshots), so the score leans on the other parts.");
  else if (c.momentum >= 0.6) pro.push("Growing fast across platforms.");
  else if (c.momentum >= 0.3) pro.push("Growing steadily.");
  else con.push("Little growth recently.");
  const depth = m["lastfm.listeners"] ? m["lastfm.playcount"] / m["lastfm.listeners"] : null;
  if (depth != null) {
    if (depth >= 30) pro.push(`Very loyal listeners: about ${Math.round(depth)} plays each on Last.fm.`);
    else if (depth < 8) con.push(`Mostly casual listening: about ${depth.toFixed(1)} plays per listener on Last.fm.`);
  }
  const biggest = Object.entries({ "YouTube subscribers": m["youtube.subscribers"], "Last.fm listeners": m["lastfm.listeners"],
    "Spotify monthly listeners": m["spotify.monthly_listeners"], "Instagram followers": m["instagram.followers"], "TikTok followers": m["tiktok.followers"] })
    .filter(([, v]) => v != null).sort((x, y) => y[1] - x[1])[0];
  if (c.headroom != null) {
    if (c.headroom >= 1) pro.push("Still small enough to have plenty of room to grow.");
    else if (c.headroom < 0.5) con.push(`Already big${biggest ? ` (${fmt(biggest[1])} ${biggest[0]})` : ""}, so the score is reduced for size.`);
    else con.push(`Getting big${biggest ? ` (${fmt(biggest[1])} ${biggest[0]})` : ""}, so the score is trimmed a little for size.`);
  }
  if (c.activity != null) {
    if (c.activity >= 0.8) pro.push(`Releasing actively: latest ${rel.latest_type || "release"} ${ago(rel.latest_release)}${rel.releases_last_year ? `, ${rel.releases_last_year} in the past year` : ""}.`);
    else if (c.activity < 0.3) con.push(`No recent releases${rel.latest_release ? ` (latest ${ago(rel.latest_release)})` : ""}.`);
  }
  const lc = a.label_class;
  if (lc === "self" || lc === "diy") pro.push("Releases their own music, so likely unsigned.");
  else if (lc === "major") con.push(`On a major label (${a.latest_label}), so probably not available.`);
  else if (lc === "indie") con.push(`On an independent label (${a.latest_label}).`);
  const mg = a.management_info?.status;
  if (mg === "unmanaged" || mg === "not_listed") pro.push(`No management ${mg === "unmanaged" ? "(you checked)" : "listed in their Instagram bio"}.`);
  else if (mg === "managed" || mg === "listed") con.push("Already has management.");
  if (s.review?.length && !a.verified_at) con.push("Some linked accounts may belong to someone else, so treat these numbers with care.");
  const list = (items, cls) => el("ul", { class: "why " + cls }, items.map(t => el("li", {}, t)));
  return el("div", { class: "explain" },
    pro.length ? [el("div", { class: "why-h pos" }, "Working for them"), list(pro, "pos")] : null,
    con.length ? [el("div", { class: "why-h neg" }, "Working against them"), list(con, "neg")] : null);
}

    kpi("YouTube views", "youtube.views", a.resolved_at ? "no channel found" : "not looked up yet"),
    igKpi(a, m),
    manualTile("spotify.monthly_listeners", "Spotify monthly listeners", a.links?.spotify, "Spotify",
      "On the artist's Spotify page, it's the number under their name: “monthly listeners”."),
    manualTile("tiktok.followers", "TikTok followers", a.links?.tiktok, "TikTok",
      "On the TikTok profile, it's the number above “Followers”."),
    kpi("Last.fm listeners", "lastfm.listeners"),
    el("div", { class: "card kpi" }, el("div", { class: "l" }, "Plays per listener"),
      el("div", { class: "v" }, depth == null ? "–" : depth.toFixed(1)), el("div", { class: "d" }, depth > 30 ? "deep fandom" : "fandom depth")),
    kpi("Deezer fans", "deezer.fans"),
    kpi("Wikipedia views (30d)", "wikipedia.pageviews_30d", "no article"));

  // charts
  const byMetric = {};
  for (const h of r.history) (byMetric[h.metric] ||= []).push(h);
  const charts = el("div", { class: "charts" }, Object.keys(METRICS).filter(k => byMetric[k]).map(k => lineChart(byMetric[k], METRICS[k], rel.recent || [])));
  const snapDays = new Set(r.history.map(h => h.taken_at.slice(0, 10))).size;

  // score card
  const scoreCard = el("div", { class: "card card-pad" },
    el("h3", {}, "Breakout score", el("span", { class: "aside" }, `${Math.round(s.confidence * 100)}% confidence`)),
    el("div", { class: "score-card" }, ring(s.score, s.confidence),
      el("div", { class: "dim", style: "font-size:12.5px" },
        s.confidence < 0.7 ? "Provisional. Some inputs are missing, so the score uses only the parts that have data." : "Built from all five inputs.",
        s.components.headroom != null && s.components.headroom < 1
          ? el("div", { style: "margin-top:6px" }, `Size cap: total × ${(0.3 + 0.7 * s.components.headroom).toFixed(2)} because the audience is already ${s.components.headroom < 0.5 ? "large" : "growing past the sweet spot"}.`) : null)),
    explainScore(r),
    el("div", { class: "dim", style: "font-size:11.5px;margin:12px 0 2px;text-transform:uppercase;letter-spacing:.05em" }, "The parts of the score"),
    Object.entries(COMP).map(([k, [label, w]]) => {
      const v = s.components[k];
      return el("div", { class: "comp" },
        el("span", { class: "k" }, label, " ", el("small", {}, w + "%")),
        el("span", { class: "bar" + (v == null ? " na" : "") }, v == null ? null : el("i", { style: `width:${v * 100}%` })),
        el("span", { class: "x" }, v == null ? "n/a" : Math.round(v * 100)));
    }),
    s.flags.length ? el("div", { class: "flags" }, s.flags.map(f => el("div", { class: flagClass(f) }, f))) : null);

  // releases
  const releases = el("div", { class: "card card-pad" },
    el("h3", {}, "Releases", el("span", { class: "aside" }, `${rel.releases_last_year ?? 0} in the last 12 months`)),
    rel.latest_label ? el("div", { style: "margin-bottom:8px;font-size:13px;color:var(--text-2)" }, "Latest label ",
      labelPill(rel.latest_label, a.label_class)) : null,
    (rel.recent || []).length ? (rel.recent || []).map(x => el("div", { class: "rel" },
      el("span", { class: "t", title: x.title }, x.title), el("span", { class: "ty" }, x.type), el("span", { class: "dt" }, x.date)))
      : el("div", { class: "dim" }, "No releases found on Deezer."));

  const similar = el("div", { class: "card card-pad" }, el("h3", {}, "Similar artists", el("span", { class: "aside" }, "Deezer fans")),
    r.similar_artists.length ? el("div", { class: "chips" }, r.similar_artists.map(x => el("button", { class: "chip", onclick: () => go(x.name) }, x.name, el("small", {}, fmt(x.deezer_fans)))))
      : el("div", { class: "dim" }, "None found."));

  const noteBox = el("textarea", { class: "input", placeholder: "Add a scouting note — show report, contact, gut feel…" });
  const notes = el("div", { class: "card card-pad" }, el("h3", {}, "Notes", el("span", { class: "aside" }, r.notes.length || "")),
    r.notes.length ? r.notes.map(n => el("div", { class: "note" }, el("time", {}, n.created_at.slice(0, 10)), n.body)) : el("div", { class: "dim", style: "font-size:13px" }, "No notes yet."),
    noteBox, el("div", { style: "display:flex;justify-content:flex-end;margin-top:8px" }, el("button", { class: "btn", onclick: async () => {
      if (!noteBox.value.trim()) return;
      await post("/api/note", { name: a.name, body: noteBox.value.trim() }); toast("Note saved"); renderArtist(a.name);
    } }, "Save note")));

  view.replaceChildren(back, hero, archivedBanner(a) || reviewBanner(a, s) || "",
    el("div", { class: "layout" },
      el("div", { class: "stack" }, kpis,
        el("div", {}, el("div", { class: "page-head", style: "margin:8px 0 10px" },
          el("h3", { style: "margin:0;font-size:13px;font-weight:600" }, "Trends"),
          el("span", { class: "dim", style: "font-size:12px" }, `${snapDays} day${snapDays === 1 ? "" : "s"} of snapshots · `,
            el("span", { style: "color:var(--warn)" }, "┆"), " release")), charts),
        releases),
      el("div", { class: "stack" }, scoreCard, managementCard(a), similar, notes, manageCard(a))),
    r.errors.length ? el("div", { class: "errors" }, "Source issues: " + r.errors.join("; ")) : null);
}

// ============================================================ CSV export
// Exactly the rows on screen, with every number a spreadsheet would want.
const CSV_COLUMNS = [
  ["Artist", r => r.name], ["Country", r => r.country], ["Genres", r => (r.genres || []).join("; ")],
  ["Breakout score", r => r.score], ["Confidence", r => r.confidence],
  ["Momentum", r => r.components?.momentum == null ? "" : Math.round(r.components.momentum * 100)],
  ["Accelerating", r => r.accelerating ? "yes" : ""],
  ["Deezer fans", r => r.deezer_fans], ["Last.fm listeners", r => r.lastfm_listeners],
  ["Plays per listener", r => r.lastfm_listeners ? (r.lastfm_playcount / r.lastfm_listeners).toFixed(1) : ""],
  ["YouTube subscribers", r => r.youtube_subscribers], ["YouTube views", r => r.youtube_views],
  ["Instagram followers", r => r.instagram_followers],
  ...[["youtube", "YouTube"], ["lastfm", "Last.fm"], ["deezer", "Deezer"], ["instagram", "Instagram"], ["spotify", "Spotify"], ["tiktok", "TikTok"]]
    .map(([k, t]) => [`${t} 7-day change`, r => r.change_7d?.[k] ? r.change_7d[k].delta : ""]),
  ["Days tracked", r => r.snapshot_days], ["Latest release", r => r.latest_release], ["Label", r => r.label],
  ["Label type", r => (LABEL_CLASS[r.label_class] || [""])[0]], ["Management", r => r.management?.label],
  ["Watchlist stage", r => r.status], ["Owner", r => r.owner], ["Next step", r => r.next_step], ["Due", r => r.next_date],
  ["Tags", r => (r.tags || []).join("; ")], ["Signals", r => (r.flags || []).join("; ")],
  ["Account issues", r => r.verified ? "" : (r.review || []).join("; ")],
];
const csvCell = v => { const t = v == null ? "" : String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
function downloadCsv(rows, name) {
  const lines = [CSV_COLUMNS.map(([h]) => h), ...rows.map(r => CSV_COLUMNS.map(([, f]) => f(r)))].map(l => l.map(csvCell).join(","));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });  // BOM so Excel reads accents
  const a = el("a", { href: URL.createObjectURL(blob), download: `ar-scout-${name}-${new Date().toLocaleDateString("en-CA")}.csv` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Downloaded ${rows.length} artist${rows.length === 1 ? "" : "s"}`);
}
const csvBtn = (getRows, name) => el("button", { class: "btn ghost", onclick: () => downloadCsv(getRows(), name) }, "Download CSV");

// ============================================================ admin tools
// Hides controls that cost API quota, rewrite linked accounts or delete data. This is for simplicity, not
// security: the password login is what protects them.
const adminOnly = node => { node.classList.add("admin-only"); return node; };
let adminOn = false;
try { adminOn = localStorage.getItem("ars-admin") === "1"; } catch {}
document.body.classList.toggle("admin", adminOn);
$("#adminToggle").checked = adminOn;
$("#adminToggle").onchange = e => {
  adminOn = e.target.checked;
  document.body.classList.toggle("admin", adminOn);
  try { localStorage.setItem("ars-admin", adminOn ? "1" : "0"); } catch {}
  toast(adminOn ? "Admin tools shown" : "Admin tools hidden");
};

// ============================================================ boot
let igOn = false;
async function loadHealth() {
  try {
    const h = await api("/api/health");
    const row = (k, v, warn) => el("div", { class: "row" }, el("span", {}, k), el("span", { class: warn ? "warn" : "" }, v));
    $("#health").replaceChildren(...[
      row("Last snapshot", h.last_snapshot ? ago(h.last_snapshot) === "today" ? new Date(h.last_snapshot).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : ago(h.last_snapshot) : "never", !h.last_snapshot),
      adminOnly(row("Daily job", h.daily_job ? `on · ${h.daily_job_at || "09:00"}` : "off", !h.daily_job)),
      row("With growth data", `${h.with_growth} / ${h.artists}`),
      adminOnly(row("Last backup", !h.last_backup ? "none yet" : h.last_backup === new Date().toLocaleDateString("en-CA") ? "today" : ago(h.last_backup + "T12:00:00"), !h.last_backup)),
      h.unlinked ? adminOnly(row("Not linked", h.unlinked, true)) : null].filter(Boolean));
    $("#health").title = h.daily_job ? "" : "Run scripts/install-daily-snapshot.sh to snapshot every day";
  } catch {}
}
async function loadCounts() {
  try {
    const [all, watch] = await Promise.all([api("/api/leaderboard?limit=10000"), api("/api/leaderboard?watchlist=true&limit=10000")]);
    $("#cntAll").textContent = all.length || ""; $("#cntWatch").textContent = watch.length || "";
    $("#cntReview").textContent = all.filter(r => r.review?.length && !r.verified).length || "";
  } catch {}
}
api("/api/status").then(st => {
  igOn = !!st.instagram;
  // Team sign-ins can't run admin actions (the server refuses them), so they don't get the switch.
  if (st.role === "team") {
    adminOn = false; document.body.classList.remove("admin");
    $(".admin-toggle").hidden = true;
  }
  if (st.login) {
    const out = el("button", { class: "linkish signout", onclick: async () => { await fetch("/api/logout", { method: "POST" }); location.href = "/login"; } },
      `Sign out${st.role === "admin" ? " (admin)" : ""}`);
    $(".sources").append(out);
  }
  const names = { deezer: "Deezer", lastfm: "Last.fm", youtube: "YouTube", instagram: "Instagram", musicbrainz: "MusicBrainz", wikipedia: "Wikipedia", spotify: "Spotify" };
  $("#srcList").replaceChildren(...Object.entries(names).map(([k, n]) =>
    el("div", { class: "src", title: st[k] ? "Connected" : "Not configured — add a key to .env" }, el("span", { class: "dot" + (st[k] ? "" : " off") }), n,
      st[k] ? null : el("span", { class: "dim", style: "margin-left:auto;font-size:11px" }, "off"))));
}).catch(() => {});
loadCounts();
loadHealth();
route();
drawCompareBar();
window.addEventListener("hashchange", drawCompareBar);
</script>
</body>
