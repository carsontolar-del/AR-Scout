[project]
name = "ar-scout"
version = "0.1.0"
description = "A&R research tool: discover and track up-and-coming artists across music data APIs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.scripts]
ar-scout = "ar_scout.cli:app"
ar-scout-mcp = "ar_scout.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ar_scout"]
